<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SafeBeat</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #8c464b;
    --pink-dark: #662b2f;
    --pink-pale: #f6f4f4;
    --pink-soft: #fbfafa;
    --ink: #1f1f1f;
    --text: #615f5f;
    --line: #e3e1e1;
    --white: #ffffff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink);
    background: var(--white);
    font-family: Inter, Arial, sans-serif;
    line-height: 1.55;
  }

  main {
    width: min(420px, calc(100% - 48px));
    padding: 56px 40px;
    text-align: center;
  }

  .logo {
    width: 84px;
    height: 84px;
    margin: 0 auto 28px;
    border-radius: 22px;
    object-fit: cover;
  }

  h1 {
    margin: 0 0 10px;
    font-size: 34px;
    font-weight: 800;
    letter-spacing: -1.2px;
  }

  h1 span {
    color: var(--pink);
  }

  p {
    margin: 0 0 36px;
    color: var(--text);
    font-size: 14px;
  }

  .actions {
    display: grid;
    gap: 14px;
  }

  .button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 52px;
    padding: 12px 20px;
    color: var(--white);
    background: rgba(102, 43, 47, .92);
    border: 1px solid rgba(102, 43, 47, .92);
    border-radius: 12px;
    font-size: 14px;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
    transition: .2s ease;
  }

  .button:hover {
    background: var(--pink);
    border-color: var(--pink);
    transform: translateY(-1px);
  }

  .button.secondary {
    color: var(--pink-dark);
    background: var(--white);
    border: 1px solid var(--line);
  }

  .button.secondary:hover {
    background: var(--pink-pale);
    border-color: var(--pink);
    color: var(--pink-dark);
  }

  .button span {
    font-size: 16px;
  }

  footer {
    margin-top: 40px;
    color: var(--text);
    font-size: 11px;
    letter-spacing: .3px;
  }
</style>
</head>
<body>
  <main>
    <img class="logo" src="logo.png" alt="SafeBeat logo">
    <h1>Safe<span>Beat</span></h1>
    <p>Intelligent cardiovascular monitoring for athletes.</p>
    <div class="actions">
      <a class="button" href="https://safebeat-website.vercel.app" target="_blank" rel="noopener">Visit the website <span>→</span></a>
      <a class="button secondary" href="https://drive.usercontent.google.com/download?id=1vPsaFwz7yecyXuG2KvGwY-EwmWIMuSLJ" target="_blank" rel="noopener">Download the app <span>→</span></a>
    </div>
    <footer>SafeBeat</footer>
  </main>
</body>
</html>
